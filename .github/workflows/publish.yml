name: Publish public ATGV extension releases

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-extension-release
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Copy and verify the latest public ATGV release
        env:
          ATGV_RELEASE_KIND: extension
          GH_TOKEN: ${{ github.token }}
        run: node scripts/mirror-public-release.js
